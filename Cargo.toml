[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
pin-project = "1"
directories = "5"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
bcrypt = "0.15"
jsonwebtoken = "9"
tempfile = "3"

[profile.release]
opt-level = 3
# LTO disabled: counsel-api's final link OOM-kills rustc on the 896MB Aliyun
# box (need 2GB+ resident at the link step, swap is not enough). Small runtime
# gain isn't worth deploy fragility. Re-enable only if the host gets >2GB RAM.
lto = false
