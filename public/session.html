            personaTexts[ev.name] = '';
            appendEvalCard(ev.name, '', true);
          } else if (ev.type === 'persona_chunk') {
            personaTexts[ev.name] = (personaTexts[ev.name] || '') + ev.chunk;
            updateEvalCard(ev.name, personaTexts[ev.name], true);
          } else if (ev.type === 'persona_done') {
            updateEvalCard(ev.name, personaTexts[ev.name] || '', false);
          } else if (ev.type === 'facilitator_chunk') {
            s8FullText += ev.chunk;
            document.getElementById('s8-raw').innerHTML = `<div class="md-body cur">${md(s8FullText)}</div>`;
          } else if (ev.type === 'facilitator_done') {
            document.getElementById('s8-sub').textContent = '勾选要执行的行动，写下你的心得';
            // 渲染 todo 列表
            renderS8Items(s8FullText);
            // 显示案主心得输入区和完成按钮
            document.getElementById('s8-reflection-area').style.display = 'block';
            document.getElementById('s8-complete-area').style.display = 'block';
            document.getElementById('s8-raw').innerHTML = '';
          } else if (ev.type === 'step_done') {
            // 不再在这里显示 s8-done，等用户点完成
          } else if (ev.type === 'error') {
            showError('s8-error', ev.message);
          }
        } catch {}
      }
    }
  } catch(e) { showError('s8-error', '生成失败：' + e.message); }
}

function appendEvalCard(nameOrId, text, streaming) {
  const p = PERSONAS.find(p => p.name === nameOrId || p.id === nameOrId);
  const emoji = p ? p.emoji : '🎙️';
  const name = p ? p.name : nameOrId;
  const id = 's8-eval-' + (p ? p.id : nameOrId);
  const container = document.getElementById('s8-evals');
  const div = document.createElement('div');
  div.id = id;
  div.className = 'dbmsg' + (streaming ? ' streaming' : '');
  div.innerHTML = `<div class="dbmsg-hdr"><div class="dbmsg-av" data-p="${p ? p.id : ''}">${emoji}</div><div class="dbmsg-name">${escHtml(name)} · 对你的评价</div></div>
    <div class="dbmsg-text">${streaming ? '' : (text ? `<div class="md-body">${md(text)}</div>` : '')}</div>`;
  container.appendChild(div);
}

function updateEvalCard(nameOrId, text, streaming) {
  const p = PERSONAS.find(p => p.name === nameOrId || p.id === nameOrId);
  const id = 's8-eval-' + (p ? p.id : nameOrId);
  const div = document.getElementById(id);
  if (!div) { appendEvalCard(nameOrId, text, streaming); return; }
  div.className = 'dbmsg' + (streaming ? ' streaming' : '');
  const textEl = div.querySelector('.dbmsg-text');
  if (streaming) {
    textEl.textContent = text;
  } else {
    textEl.innerHTML = `<div class="md-body">${md(text)}</div>`;
  }
}

function renderS8Items(text) {
  const container = document.getElementById('s8-items');
  container.innerHTML = '';
  const lines = text.split('\n');
  const items = [];
  for (const line of lines) {
    const listMatch = line.match(/^[-*]\s+(.+)/) || line.match(/^\d+\.\s+(.+)/);
    if (listMatch) {
      items.push({ text: listMatch[1].trim(), meta: '' });
    }
  }

  if (items.length === 0) return;

  items.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'aitem';
    div.innerHTML = `<div class="aitem-check"></div>
      <div class="aitem-body">
        <div class="aitem-text">${escHtml(item.text)}</div>
        ${item.meta ? `<div class="aitem-meta">${escHtml(item.meta)}</div>` : ''}
      </div>`;
    div.onclick = () => {
      div.classList.toggle('checked');
      div.querySelector('.aitem-check').textContent = div.classList.contains('checked') ? '✓' : '';
    };
    container.appendChild(div);
  });
}

async function completeS8() {
  if (s8Done) return;
  const btn = document.getElementById('s8-complete-btn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '存档中…';

  const reflection = document.getElementById('s8-reflection')?.value.trim() ?? '';
  const checkedTodos = [...document.querySelectorAll('#s8-items .aitem.checked')]
    .map(el => el.querySelector('.aitem-text')?.textContent?.trim() ?? '');

  try {
    await fetch(`/api/projects/${projectId}/sessions/${sessionId}/steps/complete`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reflection, checkedTodos })
    });

    s8Done = true;
    document.getElementById('s8-reflection-area').style.display = 'none';
    document.getElementById('s8-complete-area').style.display = 'none';
    document.getElementById('s8-done').style.display = 'block';
    setHostState('done');
  } catch(e) {
    showError('s8-error', '存档失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '完成，存档到 User Wiki →';
  }
}

// ── HELPERS ─────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function md(text) {
  if (!text) return '';
  return marked.parse(text);
}

// streaming 时用 escHtml（避免 markdown 残缺标签闪烁），完成后用 md
function renderText(text, streaming) {
  if (streaming) {
    return `<span style="white-space:pre-wrap">${escHtml(text)}</span>`;
  }
  return `<div class="md-body">${md(text)}</div>`;
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<div class="error-msg">${escHtml(msg)}</div>`;
}

// ── INIT ─────────────────────────────────────────────────
if (!projectId) {
  location.href = '/';
} else {
  loadPersonas().then(() => {
    if (!sessionId) {
      showStep('s1');
    } else {
      fetch(`/api/projects/${projectId}/sessions/${sessionId}`)
        .then(r => r.json())
        .then(session => {
          const step = session.currentStep || 0;
          if (step <= 0) {
            showStep('s1');
          } else if (step === 1) {
            showStep('s2');
            initS2();
          } else if (step === 2) {
            showStep('s3');
            initS3();
          } else if (step === 3) {
            showStep('s4');
            initS4();
          } else if (step === 4) {
            showStep('s5');
            initS5();
          } else if (step === 5) {
            showStep('s6');
            initS6([]);
          } else if (step === 6) {
            showStep('s7');
            initS7();
          } else if (step >= 7) {
            showStep('s8');
            initS8();
          } else {
            showStep('s1');
          }
        })
        .catch(() => showStep('s1'));
    }
  });
}
</script>
