<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参谋 · Counsel AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-size:22px;font-weight:600;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:36px}
.new-form{display:flex;justify-content:center;margin-bottom:36px;width:100%;max-width:480px}
.btn{padding:8px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:#000}
.btn:hover{background:#e8e8e8}
.cards{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;cursor:pointer;transition:all .15s}
.card:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07)}
.card-name{font-size:14px;font-weight:500;margin-bottom:4px}
.card-meta{font-size:10px;color:rgba(255,255,255,.3);display:flex;gap:10px}
.empty{font-size:12px;color:rgba(255,255,255,.25);text-align:center;padding:32px}
</style>
</head>
<body>
<h1>参谋 · Counsel AI</h1>
<p class="sub">AI 私董会 — 12位顾问，并行思考，帮你做决策</p>

<div class="new-form">
  <button class="btn" onclick="createProject()">开始新讨论 →</button>
</div>

<div class="cards" id="cards">
  <div class="empty">加载中…</div>
</div>

<script>
async function load() {
  const res = await fetch('/api/projects').then(r => r.json());
  const el = document.getElementById('cards');
  if (!res.length) { el.innerHTML = '<div class="empty">还没有讨论，点击上方按钮开始吧</div>'; return; }
  el.innerHTML = res.reverse().map(p => `
    <div class="card" onclick="enterProject('${p.id}','${p.latestSessionId||''}')">
      <div class="card-name">${p.name}</div>
      <div class="card-meta">
        <span>${p.sessionCount} 次讨论</span>
        <span>${new Date(p.createdAt).toLocaleDateString('zh')}</span>
      </div>
    </div>
  `).join('');
}

async function createProject() {
  const proj = await fetch('/api/projects', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: '新讨论' })
  }).then(r => r.json());

  location.href = `/session.html?projectId=${proj.id}`;
}

async function enterProject(projectId, sessionId) {
  if (sessionId) {
    location.href = `/session.html?projectId=${projectId}&sessionId=${sessionId}`;
  } else {
    // 没有已有 session，跳转让用户在 S1 创建
    location.href = `/session.html?projectId=${projectId}`;
  }
}

load();
</script>
</body>
</html>
